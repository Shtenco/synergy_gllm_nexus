name: crc-second-blind

# Historical one-shot evidence only. The authoritative successful run is
# 37143234492 at the frozen cognitive SHA 97a9c7ed12900969c68ba596e629c70adb398f06.
# Do not auto-rerun this consumed blind after architecture changes.
on:
  workflow_dispatch:

jobs:
  second-blind:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify post-fix cognitive architecture freeze
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=97a9c7ed12900969c68ba596e629c70adb398f06
          if ! git diff --quiet "$FREEZE" HEAD -- src/nexus_gllm/unified_v3/cognitive/; then
            echo "Cognitive architecture changed after second-blind freeze"
            git diff --stat "$FREEZE" HEAD -- src/nexus_gllm/unified_v3/cognitive/
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install pytest numpy httpx
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run second-blind contract tests
        run: pytest -q tests/crc_r1/test_second_blind_transfer.py

      - name: Execute second post-freeze blind battery
        run: |
          mkdir -p artifacts
          python -m benchmarks.crc_second_blind.run \
            --seeds 420001,420002,420003,420004,420005,420006,420007,420008 \
            --repeats 10 \
            --budget-units 1.0 \
            --out artifacts/crc_second_blind.json

      - name: Validate protocol and mechanical verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/crc_second_blind.json').read_text(encoding='utf-8'))
          q = p['protocol']
          assert q['frozen_arch_sha'] == '97a9c7ed12900969c68ba596e629c70adb398f06'
          assert q['reuses_first_far_oos_cases'] is False
          assert q['independent_oracle'] is True
          assert q['m32_meta_opened'] is False
          assert q['ftx2_authored'] is False
          assert q['seed_count'] == 8
          assert q['repeats'] == 10
          assert p['total_cases'] == 8 * 10 * 6
          assert set(p['planning_horizons_seen']) == {2, 3, 4, 5}
          assert p['budget_violations'] == 0
          exact = p['exact_task_success']
          minimum = p['minimum_family_accuracy']
          expected = 'TRANSFER_SUPPORTED' if exact >= .80 and minimum >= .50 else ('PARTIAL_TRANSFER' if exact >= .50 else 'FAIL')
          assert p['verdict'] == expected
          print('SECOND BLIND VERDICT:', p['verdict'])
          print('EXACT SUCCESS:', exact)
          print('MIN FAMILY:', minimum)
          print('FAMILY ACCURACY:', p['family_accuracy'])
          print('HORIZONS:', p['planning_horizons_seen'])
          print('SEED STD:', p['seed_success_std'])
          PY

      - name: Upload second-blind evidence
        uses: actions/upload-artifact@v4
        with:
          name: crc-second-blind-${{ github.sha }}
          path: artifacts/crc_second_blind.json
          retention-days: 90
