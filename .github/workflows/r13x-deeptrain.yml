name: NEXUS R1.3-X deep train
on:
  push:
    branches: ["nexus-r13x-deeptrain-2026-09-26"]
  workflow_dispatch:
jobs:
  deeptrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Environment
        run: |
          python -V
          git rev-parse HEAD
          find nexus_gllm recovery -maxdepth 3 -type f | sort | head -200
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch pytest
      - name: Baseline frozen R1.3-X benchmark
        run: |
          mkdir -p artifacts/r13x_deeptrain
          PYTHONPATH=. python recovery/benchmarks/run_r13x.py | tee artifacts/r13x_deeptrain/baseline_frozen.json
      - name: Core regression
        run: |
          PYTHONPATH=. pytest -q tests/test_r13x.py
      - name: Deep curriculum train
        run: |
          PYTHONPATH=. python recovery/training/train_r13x_deep.py | tee artifacts/r13x_deeptrain/training_stdout.txt
      - name: Post-train evaluation
        run: |
          PYTHONPATH=. python recovery/benchmarks/run_r13x_deeptrain_eval.py | tee artifacts/r13x_deeptrain/eval_stdout.txt
      - name: Hash artifacts
        if: always()
        run: |
          find artifacts/r13x_deeptrain -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/r13x_deeptrain/SHA256SUMS.txt || true
          cat artifacts/r13x_deeptrain/SHA256SUMS.txt || true
      - name: Upload training artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-r13x-deeptrain-${{ github.run_number }}
          path: artifacts/r13x_deeptrain
          if-no-files-found: error
          retention-days: 30
