name: m32-evidence

on:
  pull_request:
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0ef170b88f29abf4d24aa52685b35a4bd9b6f32d
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install pytest httpx numpy
          pip install -e . --no-deps
      - name: Verify pinned implementation commit
        run: |
          test "$(git rev-parse HEAD)" = "0ef170b88f29abf4d24aa52685b35a4bd9b6f32d"
      - name: M32 DEV metrics
        run: |
          mkdir -p artifacts/m32_evidence
          python -m benchmarks.m32_dev.evaluate | tee artifacts/m32_evidence/M32_DEV_RESULT.json
      - name: Build sealed META manifest
        run: |
          python - <<'PY' | tee artifacts/m32_evidence/M32_META_FREEZE.json
          import json
          from benchmarks.m32_meta.generator import META_SEED, generate, generator_fingerprint
          from benchmarks.m32_meta.freeze import build_manifest
          cases=generate()
          m=build_manifest(generator_sha256=generator_fingerprint(),seed=META_SEED,case_count=len(cases),implementation_commit='0ef170b88f29abf4d24aa52685b35a4bd9b6f32d')
          print(json.dumps(m,indent=2,sort_keys=True))
          PY
      - name: Verify frozen R1 source is unchanged
        run: |
          git fetch --depth=1 origin fded8bd46777b2e868620b4c85d60c5c375b5ec1
          git diff --exit-code fded8bd46777b2e868620b4c85d60c5c375b5ec1 -- src/nexus_gllm/unified_v3/cognitive/conversational_reasoner.py
          sha256sum src/nexus_gllm/unified_v3/cognitive/conversational_reasoner.py | tee artifacts/m32_evidence/R1_SOURCE_SHA256.txt
      - name: Re-run M32 and frozen regressions
        run: |
          pytest tests/m32 -q | tee artifacts/m32_evidence/M32_TESTS.txt
          pytest tests/crc_r1 tests/hard_oos_f tests/hard_oos_f2 tests/crc_meta_g -q | tee artifacts/m32_evidence/FROZEN_REGRESSION_TESTS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m32-evidence-0ef170b8
          path: artifacts/m32_evidence
