name: m31-p1-recovery

on:
  pull_request:
    branches: [unified-v3-generalization-first]
    paths:
      - '.github/workflows/m31-p1-recovery.yml'
      - 'artifacts/v3_moe/p1/**'
      - 'training/v3_moe/**'
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXUS_RECOVERY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recovery dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Extract and test historical Git object
        run: |
          mkdir -p historical-git-object
          git cat-file blob 0441ffd94f8632c754c8053ee7d35ef186979e79 > historical-git-object/router.pt
          python - <<'PY' | tee historical-git-object/report.log
          import hashlib,zipfile,torch
          from pathlib import Path
          from training.v3_moe.train_router import logical_state_hash
          p=Path('historical-git-object/router.pt')
          print('GIT_OBJECT_BYTES',p.stat().st_size)
          print('GIT_OBJECT_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          print('GIT_OBJECT_IS_ZIP',zipfile.is_zipfile(p))
          try:
              state=torch.load(p,map_location='cpu',weights_only=True)
              class Box:
                  def state_dict(self): return state
              print('GIT_OBJECT_TORCH_LOAD','PASS')
              print('GIT_OBJECT_LOGICAL_SHA256',logical_state_hash(Box()))
          except Exception as exc:
              print('GIT_OBJECT_TORCH_LOAD','FAIL',type(exc).__name__,str(exc))
          PY
      - name: Diagnose committed checkpoints and rebuild from frozen provenance
        run: |
          python - <<'PY' | tee m31-p1-recovery.log
          import hashlib, json, tempfile, zipfile
          from pathlib import Path
          import torch
          from training.v3_moe.train_router import run_training, logical_state_hash

          root=Path('artifacts/v3_moe/p1')
          for name in ('router.pt','novelty.pt','calibrator.pt'):
              src=root/name
              print('COMMITTED_FILE',name)
              print('COMMITTED_BYTES',src.stat().st_size)
              print('COMMITTED_SHA256',hashlib.sha256(src.read_bytes()).hexdigest())
              print('COMMITTED_IS_ZIP',zipfile.is_zipfile(src))
              try:
                  state=torch.load(src,map_location='cpu',weights_only=True)
                  class Box:
                      def state_dict(self): return state
                  print('COMMITTED_TORCH_LOAD','PASS')
                  print('COMMITTED_LOGICAL_SHA256',logical_state_hash(Box()))
              except Exception as exc:
                  print('COMMITTED_TORCH_LOAD','FAIL',type(exc).__name__,str(exc))

          frozen=json.loads((root/'metrics.json').read_text())
          with tempfile.TemporaryDirectory() as td:
              out=run_training(td,train_n=50000,dev_n=5000,oos_n=5000,seed=17,epochs=14)
              td=Path(td);rebuilt=json.loads((td/'metrics.json').read_text())
              print('FROZEN_METRICS',json.dumps(frozen,sort_keys=True))
              print('REBUILT_METRICS',json.dumps(rebuilt,sort_keys=True))
              print('METRICS_EXACT_MATCH',rebuilt==frozen)
              print('LOGICAL_ROUTER_SHA256',out['checkpoint_sha256'])
              print('LOGICAL_NOVELTY_SHA256',out['novelty_sha256'])
              print('LOGICAL_CALIBRATOR_SHA256',out['calibrator_sha256'])
              recovered=Path('recovered-p1');recovered.mkdir(exist_ok=True)
              rebuilt_sha={}
              for name in ('router.pt','novelty.pt','calibrator.pt','metrics.json','manifest.json'):
                  data=(td/name).read_bytes();(recovered/name).write_bytes(data);rebuilt_sha[name]=hashlib.sha256(data).hexdigest()
              (recovered/'recovery.json').write_text(json.dumps({
                  'source_commit':__import__('os').environ['NEXUS_RECOVERY_COMMIT'],
                  'metrics_exact_match':rebuilt==frozen,
                  'logical_state_sha256':{
                      'router.pt':out['checkpoint_sha256'],
                      'novelty.pt':out['novelty_sha256'],
                      'calibrator.pt':out['calibrator_sha256'],
                  },
                  'rebuilt_sha256':rebuilt_sha,
              },indent=2,sort_keys=True))
              if rebuilt!=frozen:
                  raise SystemExit('recovered P1 does not reproduce frozen metrics exactly')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m31-p1-recovered
          path: |
            recovered-p1
            historical-git-object
            m31-p1-recovery.log
          if-no-files-found: error
          retention-days: 30
