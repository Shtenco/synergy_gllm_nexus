name: unified-nexus-rebuild-v1

on:
  push:
    branches:
      - unified-nexus-rebuild-v1
  pull_request:
    branches:
      - nexus-gllm-omega1-v1

jobs:
  rebuild-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_rebuild_freeze.py
      - run: python -m compileall src/nexus_gllm/rebuild_freeze.py
