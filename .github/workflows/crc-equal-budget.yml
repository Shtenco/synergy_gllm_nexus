name: crc-equal-budget

on:
  pull_request:
    branches: [crc-r1-foundation]
    paths:
      - 'src/nexus_gllm/unified_v3/cognitive/**'
      - 'benchmarks/crc_equal_budget/**'
      - 'tests/crc_r1/**'
      - '.github/workflows/crc-equal-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark package
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
      - name: Run controlled equal-budget A-B-C-D-E benchmark
        run: |
          mkdir -p artifacts
          python -m benchmarks.crc_equal_budget.run \
            --seed 1701 \
            --repeats 64 \
            --budget-units 1.0 \
            --out artifacts/crc_equal_budget.json
      - name: Validate scientific contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/crc_equal_budget.json')
          x=json.loads(p.read_text())
          assert x['protocol']['same_case_ids_across_stages'] is True
          assert x['protocol']['final_transfer_evidence'] is False
          assert all(s['budget_violations']==0 for s in x['stages'].values())
          assert all(s['max_compute_spent'] <= x['protocol']['budget_units'] + 1e-12 for s in x['stages'].values())
          assert x['stages']['D_CREDIT']['ineligible_positive_credit_mass'] == 0.0
          print(json.dumps(x, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crc-equal-budget-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/crc_equal_budget.json
          if-no-files-found: error
