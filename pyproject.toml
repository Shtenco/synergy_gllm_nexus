[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-gllm"
version = "0.1.0"
description = "NEXUS GLLM Omega-1 graph-native language and cognition research runtime"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "."]
